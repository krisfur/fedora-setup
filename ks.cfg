# Partial kickstart: the installer still asks for wifi, disk, and the user.
# The user must be kfurman. First boot then applies the playbook and reboots.
lang en_GB.UTF-8
keyboard uk
timezone Europe/London --utc

%packages
@core
# Wifi plugin and firmware, which Custom Operating System leaves out.
@networkmanager-submodules
@hardware-support
# nmtui for fixing wifi if first boot fails.
NetworkManager-tui
git
ansible
%end

%post --log=/var/log/fedora-setup-ks.log
cat > /usr/local/libexec/fedora-setup-firstboot <<'SCRIPT'
#!/bin/bash
# Runs once as root. Failure leaves a console login and retries on next boot.
set -u
u=kfurman
repo=/home/$u/code/fedora-setup
log=/var/log/fedora-setup-firstboot.log
sudoers=/etc/sudoers.d/90-fedora-setup-firstboot
issue=/etc/issue.d/90-fedora-setup.issue
exec > >(tee -a "$log") 2>&1

# The login prompt clears the screen, so the banner has to carry the reason.
fail() {
  printf 'fedora-setup: %s. See %s.\nLog in, fix it (wifi: nmtui or nmcli), and reboot to retry.\n\n' "$1" "$log" | tee "$issue"
  exit 1
}

# The playbook asks for sudo as the user, so allow it for this run only.
cleanup() {
  rm -f "$sudoers"
  loginctl disable-linger "$u"
}
trap cleanup EXIT

echo "fedora-setup: applying the playbook. This takes a while."
id "$u" >/dev/null 2>&1 || fail "user $u does not exist"
nm-online -q -t 120 || fail "no network"

if [ ! -d "$repo/.git" ]; then
  runuser -u "$u" -- mkdir -p "/home/$u/code"
  runuser -u "$u" -- git clone https://github.com/krisfur/fedora-setup "$repo" || fail "git clone failed"
fi

echo "$u ALL=(ALL) NOPASSWD: ALL" > "$sudoers"
chmod 0440 "$sudoers"

# dconf and mise need the user's runtime directory and session bus.
loginctl enable-linger "$u"
uid=$(id -u "$u")
for _ in $(seq 30); do
  [ -S "/run/user/$uid/bus" ] && break
  sleep 1
done

runuser -l "$u" -c "cd $repo && XDG_RUNTIME_DIR=/run/user/$uid DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus ANSIBLE_BECOME_ASK_PASS=False ansible-playbook site.yml" \
  || fail "the playbook failed"

systemctl disable fedora-setup-firstboot.service
rm -f /etc/systemd/system/fedora-setup-firstboot.service "$issue" "$0"
echo "fedora-setup: done, rebooting."
cleanup
trap - EXIT
systemctl reboot
SCRIPT
chmod 0755 /usr/local/libexec/fedora-setup-firstboot

cat > /etc/systemd/system/fedora-setup-firstboot.service <<'UNIT'
[Unit]
Description=Apply fedora-setup on first boot
Wants=network-online.target
After=network-online.target systemd-user-sessions.service
Before=getty@tty1.service

[Service]
Type=oneshot
TimeoutStartSec=infinity
ExecStart=/usr/local/libexec/fedora-setup-firstboot
StandardOutput=tty
StandardError=tty
TTYPath=/dev/tty1

[Install]
WantedBy=multi-user.target
UNIT

restorecon /usr/local/libexec/fedora-setup-firstboot /etc/systemd/system/fedora-setup-firstboot.service
systemctl enable fedora-setup-firstboot.service
%end
