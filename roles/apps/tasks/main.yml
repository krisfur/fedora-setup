# Fedora's ffmpeg-free and mesa omit patented codecs, which costs H.264/HEVC
# hardware decode. allowerasing swaps the -free builds for RPM Fusion's.
- name: Read GPU vendors
  ansible.builtin.shell: cat /sys/class/drm/card[0-9]/device/vendor
  register: apps_gpu_vendors
  changed_when: false
  failed_when: false

# 0x1002 is AMD and 0x8086 is Intel. intel-media-driver needs Broadwell or later.
- name: Install full codecs
  ansible.builtin.dnf:
    name: >-
      {{ ['ffmpeg']
      + (['mesa-va-drivers-freeworld'] if '0x1002' in apps_gpu_vendors.stdout else [])
      + (['intel-media-driver'] if '0x8086' in apps_gpu_vendors.stdout else []) }}
    allowerasing: true
    state: present

- name: Install applications
  ansible.builtin.dnf:
    name:
      - helium-bin
      - ghostty
      # glib checks xdg-terminal-exec before its hardcoded terminal list;
      # ghostty is selected via ~/.config/xdg-terminals.list.
      - xdg-terminal-exec
      - network-manager-applet
      - discord
      - mpv
      - imv
      - gimp
      - transmission-gtk
      - btop
      - xarchiver
      - fastfetch
      - steam
      - gamescope
      - mangohud
      - dolphin-emu
      - libmtp
      - android-tools
      # FUSE 2 and 3 runtimes for the AppImages in roles/user.
      - fuse
      - fuse-libs
      - fuse3
    state: present

- name: Install Proton Authenticator
  ansible.builtin.import_tasks: proton-authenticator.yml
  tags: upstream

- name: Install controller udev rules
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/udev/rules.d/{{ item }}"
    mode: "0644"
  loop:
    - 51-dolphin.rules
    - 70-corsair-uaccess.rules
    - 99-corsair-xpad.rules
  notify: Reload udev
