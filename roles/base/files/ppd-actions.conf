# ppd 0.30's amdgpu actions store their on/off state in
# /var/lib/power-profiles-daemon rather than in config, so re-assert both on
# every start to stop the stateful toggles drifting. amdgpu_panel_power is ABM,
# which dims the panel on power-saver; amdgpu_dpm tunes GPU clocks.
[Service]
ExecStartPost=/usr/bin/powerprofilesctl configure-action --enable amdgpu_dpm
ExecStartPost=/usr/bin/powerprofilesctl configure-action --enable amdgpu_panel_power
